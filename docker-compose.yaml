# version: '3.9'
# docker-compose up db    # start db
# docker-compose exec db bash    # start shell in this container
services:
    db:
        image: postgres:16-alpine
        container_name: postgres_container
        environment:
            POSTGRES_USER: root
            POSTGRES_PASSWORD: '12345'
            POSTGRES_DB: portaldb
        ports:
            - '5432:5432'
        volumes:
            - 'db_data:/var/lib/postgresql/data'

    # Local SMTP catcher for testing email sends without hitting real inboxes.
    # SMTP on :1025, web UI on http://localhost:8025
    # Use with .env: SMTP_HOST=localhost, SMTP_PORT=1025, SMTP_SECURE=false
    mailpit:
        image: axllent/mailpit
        container_name: mailpit_container
        ports:
            - '1025:1025'
            - '8025:8025'

volumes:
    db_data:
# postgres://root:12345@localhost:5432/portaldb
